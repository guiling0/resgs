<html>

<head>
    <title>新神杀RE</title>
    <meta charset='utf-8' />
    <meta name='renderer' content='webkit' />
    <meta name='viewport'
        content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover' />
    <meta name='apple-mobile-web-app-capable' content='yes' />
    <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent' />
    <meta name='full-screen' content='true' />
    <meta name='x5-fullscreen' content='true' />
    <meta name='360-fullscreen' content='true' />
    <meta http-equiv='expires' content='0' />
    <meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1' />
    <meta http-equiv='Cache-Control' content='no-siteapp' />
    <link rel="stylesheet" href="dom-ui.css" />
</head>

<body style="margin: 0;background-color: {{backgroundColor}};color: #fff;">
    <!-- 进入动画 -->
    <div id="entry-overlay" style="
        position:fixed;inset:0;z-index:999999;
        background:#1a1a2e;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        transition:opacity .4s ease-out;
    ">
        <img id="entry-logo" src="favicon.ico" style="
            width:128px;height:128px;
            opacity:0;transform:translateY(40px) scale(.8);
            transition:opacity 1.2s cubic-bezier(.22,.61,.36,1),transform 1.2s cubic-bezier(.22,.61,.36,1);
        " />
        <div id="entry-hint" style="
            margin-top:60px;font-size:18px;color:rgba(255,255,255,.5);
            letter-spacing:4px;
            animation:entry-pulse 2s ease-in-out infinite;
        ">— 点击进入 —</div>
    </div>

    <!-- 旋转提示 -->
    <div id="rotate-hint" style="
        display:none;position:fixed;inset:0;z-index:999998;
        background:#1a1a2e;
        flex-direction:column;align-items:center;justify-content:center;
    ">
        <div style="
            width:80px;height:60px;border:3px solid rgba(255,255,255,.4);border-radius:8px;
            margin-bottom:24px;
            animation:rotate-phone 2s ease-in-out infinite;
        "></div>
        <div style="font-size:20px;color:rgba(255,255,255,.6);letter-spacing:4px;">请旋转屏幕</div>
    </div>

    <!-- DOM 浮层容器：与 LayaAir 画布同步缩放 -->
    <div id="dom-overlays" style="
        position:fixed;width:1920px;height:1080px;transform-origin:left top;
        z-index:99998;
    ">
        <div id="page-entry" style="pointer-events:auto;"></div>
        <div id="toast-layer"></div>
        <div id="loading-overlay"><div class="spinner"></div></div>
    </div>

    <script src="dom-ui.js"></script>
    {{#libs}}
    <script type="{{{type}}}" src="{{{name}}}"></script>
    {{/libs}}
    {{#bundles}}
    <script type="{{{type}}}" src="{{{name}}}"></script>
    {{/bundles}}
    <script type="text/javascript" src="{{{indexJS}}}"></script>
</body>

</html>
